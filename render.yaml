# Render.com blueprint — deploys the app + a managed Postgres.
# In Render: New → Blueprint → point at this repo. Then set the secret
# env vars marked sync:false in the dashboard.
services:
  - type: web
    name: nifty-autotrader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nifty-db
          property: connectionString
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: DHAN_ENABLED
        value: "false"

databases:
  - name: nifty-db
    databaseName: trading_app
    plan: starter
