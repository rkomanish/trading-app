<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — Nifty AutoTrader'">Nifty AutoTrader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #e0e0e0; font-size: 14px; }
        .nav { background: #111; border-bottom: 1px solid #333; padding: 10px 20px; display: flex; align-items: center; gap: 20px; }
        .nav-brand { color: #00ff88; font-weight: bold; font-size: 16px; }
        .nav a { color: #aaa; text-decoration: none; padding: 5px 10px; border-radius: 3px; }
        .nav a:hover, .nav a.active { color: #fff; background: #222; }
        .mode-badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-left: auto; }
        .mode-paper { background: #1a3a1a; color: #00ff88; border: 1px solid #00ff88; }
        .mode-live  { background: #3a0a0a; color: #ff4444; border: 1px solid #ff4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: #111; border: 1px solid #222; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        .card-title { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #fff; }
        .stat-label { font-size: 11px; color: #666; margin-top: 4px; }
        .green { color: #00ff88; }
        .red { color: #ff4444; }
        .yellow { color: #ffcc00; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 13px; }
        .btn-danger { background: #cc0000; color: #fff; }
        .btn-danger:hover { background: #ff0000; }
        .btn-primary { background: #004400; color: #00ff88; border: 1px solid #00ff88; }
        .btn-primary:hover { background: #006600; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .kill-switch-btn { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; background: #880000; color: #fff; border: 2px solid #ff0000; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        .kill-switch-btn:hover { background: #cc0000; }
        table { width: 100%; border-collapse: collapse; }
        th { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 8px; text-align: left; border-bottom: 1px solid #222; }
        td { padding: 8px; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
        tr:hover td { background: #161616; }
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .badge-bullish { background: #1a3a1a; color: #00ff88; }
        .badge-bearish { background: #3a1a1a; color: #ff4444; }
        .badge-neutral { background: #2a2a2a; color: #aaa; }
        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
        .alert-danger { background: #2a0000; border: 1px solid #880000; color: #ff8888; }
        .alert-success { background: #001a00; border: 1px solid #006600; color: #88ff88; }
        .alert-warning { background: #1a1a00; border: 1px solid #666600; color: #ffff88; }
        input, select, textarea { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 8px; border-radius: 4px; font-family: inherit; }
        label { color: #888; font-size: 12px; display: block; margin-bottom: 4px; }
        .form-group { margin-bottom: 12px; }
    </style>
</head>
<nav th:fragment="nav(current)" class="nav">
    <span class="nav-brand">&#9651; NIFTY AUTOTRADER</span>
    <a th:href="@{/dashboard}" th:classappend="${current == 'dashboard'} ? 'active'">Dashboard</a>
    <a th:href="@{/trades}" th:classappend="${current == 'trades'} ? 'active'">Trades</a>
    <a th:href="@{/backtest}" th:classappend="${current == 'backtest'} ? 'active'">Backtest</a>
    <a th:href="@{/sentiment}" th:classappend="${current == 'sentiment'} ? 'active'">Sentiment</a>
    <a th:href="@{/config}" th:classappend="${current == 'config'} ? 'active'">Config</a>
    <span th:fragment="mode-badge" th:classappend="${liveMode} ? 'mode-live' : 'mode-paper'" class="mode-badge"
          th:text="${liveMode} ? '&#9888; LIVE TRADING' : '&#128196; PAPER MODE'">PAPER MODE</span>
</nav>
</html>
