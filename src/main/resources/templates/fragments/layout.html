<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — Nifty AutoTrader'">Nifty AutoTrader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #e0e0e0; font-size: 14px; }
        .nav { background: #111; border-bottom: 1px solid #333; padding: 10px 20px; display: flex; align-items: center; gap: 20px; }
        .nav-brand { color: #00ff88; font-weight: bold; font-size: 16px; }
        .nav-links { display: flex; align-items: center; gap: 20px; flex: 1; }
        .nav a { color: #aaa; text-decoration: none; padding: 5px 10px; border-radius: 3px; }
        .nav a:hover, .nav a.active { color: #fff; background: #222; }
        .nav-toggle { display: none; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0;
                      font-size: 20px; line-height: 1; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: auto; }
        .mode-badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-left: auto; }
        .mode-paper { background: #1a3a1a; color: #00ff88; border: 1px solid #00ff88; }
        .mode-live  { background: #3a0a0a; color: #ff4444; border: 1px solid #ff4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: #111; border: 1px solid #222; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        .card-title { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #fff; }
        .stat-label { font-size: 11px; color: #666; margin-top: 4px; }
        .green { color: #00ff88; }
        .red { color: #ff4444; }
        .yellow { color: #ffcc00; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 13px; }
        .btn-danger { background: #cc0000; color: #fff; }
        .btn-danger:hover { background: #ff0000; }
        .btn-primary { background: #004400; color: #00ff88; border: 1px solid #00ff88; }
        .btn-primary:hover { background: #006600; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .kill-switch-btn { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; background: #880000; color: #fff; border: 2px solid #ff0000; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        .kill-switch-btn:hover { background: #cc0000; }
        table { width: 100%; border-collapse: collapse; }
        th { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 8px; text-align: left; border-bottom: 1px solid #222; }
        td { padding: 8px; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
        tr:hover td { background: #161616; }
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .badge-bullish { background: #1a3a1a; color: #00ff88; }
        .badge-bearish { background: #3a1a1a; color: #ff4444; }
        .badge-neutral { background: #2a2a2a; color: #aaa; }
        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
        .alert-danger { background: #2a0000; border: 1px solid #880000; color: #ff8888; }
        .alert-success { background: #001a00; border: 1px solid #006600; color: #88ff88; }
        .alert-warning { background: #1a1a00; border: 1px solid #666600; color: #ffff88; }
        input, select, textarea { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 8px; border-radius: 4px; font-family: inherit; }
        label { color: #888; font-size: 12px; display: block; margin-bottom: 4px; }
        .form-group { margin-bottom: 12px; }
        input, select, textarea { max-width: 100%; }
        .theme-toggle { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; font-size: 14px;
                        padding: 4px 10px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
        .theme-toggle:hover { background: #222; }

        /* ── Global LIGHT THEME (applies to every page) ───────────────────── */
        body.light { background: #f4f5f7; color: #1f2328; }
        body.light .nav { background: #ffffff; border-bottom-color: #dcdfe4; }
        body.light .nav-brand { color: #0a8f5b; }
        body.light .nav a { color: #555; }
        body.light .nav a:hover, body.light .nav a.active { color: #111; background: #eceef1; }
        body.light .nav-toggle, body.light .theme-toggle { background: #f0f1f3; border-color: #ccc; color: #333; }
        body.light .card { background: #ffffff; border-color: #dcdfe4; }
        body.light .card-title { color: #888; }
        body.light .stat-value { color: #111; }
        body.light .stat-label, body.light .muted { color: #888; }
        body.light th { color: #888; border-bottom-color: #e3e5e9; }
        body.light td { border-bottom-color: #eceef1; }
        body.light tr:hover td { background: #f6f7f9; }
        body.light table.cards tr { background: #fafbfc; border-color: #e3e5e9; }
        body.light input, body.light select, body.light textarea { background: #fff; border-color: #ccc; color: #1f2328; }
        body.light label { color: #777; }
        body.light .btn-primary { background: #e3f5ea; color: #0a8f5b; border-color: #0a8f5b; }
        body.light .btn-primary:hover { background: #d2efdd; }
        body.light .btn-sm, body.light .btn { color: inherit; }
        body.light .mode-paper { background: #e3f5ea; color: #0a8f5b; }
        body.light .alert-warning { background: #fff8e1; border-color: #e0c200; color: #7a6500; }
        body.light .alert-success { background: #e6f7ec; border-color: #34a853; color: #1d6b35; }
        body.light .alert-danger  { background: #fdecec; border-color: #d33; color: #a11; }

        /* ── Global mobile responsiveness (applies to every page) ─────────── */
        @media (max-width: 760px) {
            .container { padding: 12px; }
            /* Hamburger menu: collapse links behind a toggle */
            .nav { flex-wrap: wrap; gap: 8px 10px; padding: 10px 12px; }
            .nav-toggle { display: block; }
            .nav-links { display: none; flex-direction: column; align-items: stretch;
                         width: 100%; gap: 2px; margin-top: 6px; }
            .nav-links.open { display: flex; }
            .nav-links a { padding: 10px 8px; border-bottom: 1px solid #1a1a1a; }
            .mode-badge { margin: 6px 0 0; align-self: flex-start; }
            /* Collapse all fixed multi-column grids to a single column */
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .stat-value { font-size: 20px; }

            /* Card-style rows: turn data tables into stacked cards (labels added by JS) */
            table.cards thead { display: none; }
            table.cards, table.cards tbody { display: block; width: 100%; }
            table.cards tr { display: block; background: #141414; border: 1px solid #222;
                             border-radius: 6px; margin-bottom: 8px; padding: 4px 8px; }
            table.cards td { display: flex; justify-content: space-between; align-items: baseline;
                             gap: 12px; border: none; padding: 5px 0; text-align: right; }
            table.cards td::before { content: attr(data-label); color: #777; font-size: 11px;
                             text-transform: uppercase; letter-spacing: 0.5px; text-align: left; flex: 0 0 auto; }
            table.cards td:empty { display: none; }
            /* Tables opting out of cards just scroll horizontally inside their card */
            .card { overflow-x: auto; }
            table.nocards { font-size: 12px; }
            table.nocards th, table.nocards td { padding: 6px; }
        }
        @media (max-width: 480px) {
            .btn { padding: 7px 12px; font-size: 12px; }
            .stat-value { font-size: 18px; }
        }
    </style>
    <script>
        // Shared mobile behaviour for every page (hamburger menu + card tables).
        document.addEventListener('DOMContentLoaded', function () {
            // Hamburger toggle
            var toggle = document.getElementById('navToggle');
            var links = document.getElementById('navLinks');
            if (toggle && links) {
                toggle.addEventListener('click', function () { links.classList.toggle('open'); });
            }
            // Turn data tables into stacked cards on mobile: label each cell from its header.
            // Skip tables marked .nocards (dense/live tables keep horizontal scroll instead).
            document.querySelectorAll('table').forEach(function (tbl) {
                if (tbl.classList.contains('nocards')) return;
                var heads = tbl.querySelectorAll('thead th');
                if (!heads.length) return;
                var labels = Array.prototype.map.call(heads, function (th) { return th.textContent.trim(); });
                tbl.querySelectorAll('tbody tr').forEach(function (tr) {
                    Array.prototype.forEach.call(tr.children, function (td, i) {
                        if (labels[i]) td.setAttribute('data-label', labels[i]);
                    });
                });
                tbl.classList.add('cards');
            });

            // Global light/dark theme
            var saved = localStorage.getItem('appTheme') || 'dark';
            window.applyAppTheme = function (t) {
                document.body.classList.toggle('light', t === 'light');
                localStorage.setItem('appTheme', t);
                var b = document.getElementById('themeToggle');
                if (b) b.innerHTML = (t === 'light' ? '&#9789;' : '&#9728;');
                if (window.onThemeChange) window.onThemeChange(t);
            };
            window.applyAppTheme(saved);
            var tg = document.getElementById('themeToggle');
            if (tg) tg.addEventListener('click', function () {
                window.applyAppTheme(document.body.classList.contains('light') ? 'dark' : 'light');
            });
        });
    </script>
</head>
<nav th:fragment="nav(current)" class="nav">
    <span class="nav-brand">&#9651; NIFTY AUTOTRADER</span>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
    <div class="nav-links" id="navLinks">
        <a th:href="@{/dashboard}" th:classappend="${current == 'dashboard'} ? 'active'">Dashboard</a>
        <a th:href="@{/trades}" th:classappend="${current == 'trades'} ? 'active'">Trades</a>
        <a th:href="@{/backtest}" th:classappend="${current == 'backtest'} ? 'active'">Backtest</a>
        <a th:href="@{/replay}" th:classappend="${current == 'replay'} ? 'active'" style="color:#ff9944">Replay</a>
        <a th:href="@{/paper}" th:classappend="${current == 'paper'} ? 'active'" style="color:#ffcc00">Paper Trading</a>
        <a th:href="@{/strategies}" th:classappend="${current == 'strategies'} ? 'active'" style="color:#88aaff">Strategies</a>
        <a th:href="@{/sentiment}" th:classappend="${current == 'sentiment'} ? 'active'">Sentiment</a>
        <a th:href="@{/config}" th:classappend="${current == 'config'} ? 'active'">Config</a>
        <span th:fragment="mode-badge" th:classappend="${liveMode} ? 'mode-live' : 'mode-paper'" class="mode-badge"
              th:text="${liveMode} ? '&#9888; LIVE TRADING' : '&#128196; PAPER MODE'">PAPER MODE</span>
        <button type="button" id="themeToggle" class="theme-toggle" title="Toggle light/dark theme">&#9728;</button>
    </div>
</nav>
</html>
