spring:
  application:
    name: nifty-autotrader
  datasource:
    url: jdbc:postgresql://localhost:5432/niftyautotrader
    username: ${DB_USERNAME:niftyautotrader}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
    encoding: UTF-8
  security:
    user:
      name: ${APP_USERNAME:admin}
      password: ${APP_PASSWORD:changeme}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.niftyautotrader: INFO
    com.niftyautotrader.service.risk: DEBUG
    com.niftyautotrader.service.execution: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ─── Application configuration ───────────────────────────────────────────────

app:
  trading:
    # MASTER TOGGLE — must be explicitly set to true to enable live trading
    live-enabled: false
    paper-slippage-percent: 0.5
    brokerage-per-round-trip: 40.0
    market-holidays:
      - "2025-01-26"
      - "2025-03-14"
      - "2025-04-14"
      - "2025-04-18"
      - "2025-05-01"
      - "2025-08-15"
      - "2025-10-02"
      - "2025-11-05"
      - "2025-12-25"

  risk:
    max-lots-per-position: 1
    max-trades-per-day: 3
    max-daily-loss: 2000.00
    weekly-circuit-breaker-loss-days: 3
    entry-window-start: "09:30"
    entry-window-end: "15:00"
    square-off-time: "15:15"
    atr-stop-multiplier: 1.5
    fixed-stop-percent: 30.0

  kite:
    api-key: ${KITE_API_KEY:not-set}
    api-secret: ${KITE_API_SECRET:not-set}
    redirect-url: ${KITE_REDIRECT_URL:http://localhost:8080/auth/kite/callback}

  sentiment:
    veto-confidence-threshold: 0.70
    anthropic-model: claude-haiku-4-5-20251001
    max-tokens: 512
    rss-feed-urls:
      - "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
      - "https://www.moneycontrol.com/rss/marketreports.xml"

  anthropic:
    api-key: ${ANTHROPIC_API_KEY:not-set}

  # Dhan free market-data API. Get a token at https://dhanhq.co
  # When enabled + credentials present, the scheduler uses Dhan (real-time);
  # otherwise it falls back to Yahoo Finance (15-min delayed).
  dhan:
    enabled: ${DHAN_ENABLED:false}
    client-id: ${DHAN_CLIENT_ID:not-set}
    access-token: ${DHAN_ACCESS_TOKEN:not-set}
    base-url: https://api.dhan.co
    nifty-security-id: "13"
    nifty-exchange-segment: "IDX_I"
    nifty-instrument: "INDEX"
