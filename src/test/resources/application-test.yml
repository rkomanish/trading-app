spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  trading:
    live-enabled: false
  risk:
    max-lots-per-position: 1
    max-trades-per-day: 3
    max-daily-loss: 2000.00
    weekly-circuit-breaker-loss-days: 3
    entry-window-start: "09:30"
    entry-window-end: "15:00"
    square-off-time: "15:15"
  kite:
    api-key: test-key
    api-secret: test-secret
  sentiment:
    veto-confidence-threshold: 0.70
  anthropic:
    api-key: test-key
